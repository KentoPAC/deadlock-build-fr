    :`<button class="copy cham" disabled title="${L('copy.todo_title')}">${L('copy.todo')}</button>`;
  let nn=0;const nTotal=b.cats.reduce((a,c)=>a+c.mods.filter(m=>m.note).length,0);
  const cats=`<div class="cats-bar"><h3>${L('bp.items')}</h3>${nTotal?`<button type="button" class="notes-btn" aria-pressed="${NOTES}">${L('bp.notes',{n:nTotal})}</button>`:''}</div>
  <div class="cats">`+b.cats.map(c=>{const nums=c.mods.map(m=>m.note?++nn:0);
    const notes=c.mods.map((m,k)=>m.note?`<li><span>${nums[k]}</span><span><b>${esc(T(m.id).n||'')}</b> — ${lk(m.note)}</span></li>`:'').join('');
    const fit=Math.min(c.mods.length,11)*92+18,w=`flex-basis:${Math.max(Math.min(Math.round((c.width||0)*.98),1100),fit>1100?0:fit,200)}px`;
    return `<section class="catp${c.optional?' catp--opt':''}" style="${w}"><div class="catp__h">${esc(catName(c.name))}${c.optional?`<span class="opt">${L('cat.optional')}</span>`:''}</div>`
    +(c.desc?`<p class="catp__d">${lk(c.desc)}</p>`:'')
    +(c.mods.length?`<div class="mods">${c.mods.map((m,k)=>modCard(m,nums[k])).join('')}</div>`:'')
    +(notes?`<ol class="catp__notes">${notes}</ol>`:'')+'</section>'}).join('')+'</div>';
  return `<article class="panel"><div class="panel__top"><div>
    <p class="panel__src">${esc(srcName(b.source))} <span>· ${esc(b.sourceInfo)}</span></p><h2>${esc(b.name)}</h2>
    <p class="facts">${L('bp.by')} <b>${esc(b.author)}</b>${b.buildId?` · build <span class="num">${b.buildId}</span>`:''}${b.translated?'':L('bp.untranslated')}</p>
    ${b.video?`<p class="facts">${L('build.video')} ${vlink(b.video.id,b.video.t,`${esc(b.video.author)}, « ${esc(b.video.title)} » (${ts(b.video.t)})`)}</p>`:''}</div>${btn}</div>
    ${statStrip(b)}${takeBlock(b)}${playSection(b)}${counterSection(b)}${b.desc?`<p class="authordesc">${lk(b.desc)}</p>`:''}${cats}${abilityGrid(b.order)}</article>`}

/* ---- comparison ---- */
const KW=[[/situ|option|util|selon|counter|contre|si /i,'Situ.',8],[/late|fin de partie|tardi|endgame/i,'Late',2],
  [/mid|milieu/i,'Mid',1],[/early|lane|début|premier|core|base|start/i,'Early',0]];
function phaseOf(c,idx){const n=PH[c.name]?c.name:catName(c.name);if(PH[n])return[PH[n].replace(' game',''),idx];
  for(const[re,lab,r]of KW)if(re.test(n))return[lab,r];return[`Cat. ${idx+1}`,idx+0.5]}
function comparePanel(){
  const rows={};D.builds.forEach((b,bi)=>b.cats.forEach((c,ci)=>{const[lab,rank]=phaseOf(c,ci);
    c.mods.forEach(m=>{const r=rows[m.id]=rows[m.id]||{id:m.id,cells:{},rank:0,n:0};
      if(r.cells[bi]==null){r.cells[bi]={lab,full:catName(c.name),p:rank,raw:c.name};r.n++;r.rank+=rank}})}));
  const N=D.builds.length,list=Object.values(rows).sort((a,b)=>b.n-a.n||a.rank/a.n-b.rank/b.n);
  const head=`<tr><th>${L('cmp.item')}</th>`+D.builds.map(b=>`<th>${esc(b.author)}${flag(buildFresh(b))}<small>${esc(srcName(b.source))}${b.winrate!=null?` · <span class="wr-${wrTone(b.winrate)}">${L('wr.short',{n:b.winrate})}</span>`:''}</small></th>`).join('')+`<th class="cnt">${L('cmp.builds')}</th></tr>`;
  const body=list.map(r=>`<tr class="${r.n===N?'all':''}"><th><div tabindex="0" data-id="${r.id}">${img(r.id)}${esc(T(r.id).n||r.id)}</div></th>`
    +D.builds.map((_,bi)=>{const c=r.cells[bi];return c?`<td class="ph" data-p="${c.p<3?0:1}" title="${esc(c.full)}">${esc(c.lab)}${PH[c.raw]||/^Situ/.test(c.raw||'')?'':'<i>*</i>'}</td>`:'<td class="none">—</td>'}).join('')
    +`<td class="cnt num">${r.n}/${N}</td></tr>`).join('');
  const styled=D.builds.some(b=>b.play&&b.play.focus);
  const style=styled?['Early','Mid','Late'].map((ph,i)=>`<tr class="cmp-style"><th>${L('focus.title')} · ${ph}</th>`+D.builds.map(b=>{const f=b.play&&b.play.focus&&b.play.focus[i];
    return f?`<td>${leanTxt(f)}</td>`:'<td class="none">—</td>'}).join('')+'<td class="cnt"></td></tr>').join(''):'';
  const common=list.filter(r=>r.n===N).length;
  return `<article class="panel"><p class="panel__src">${L('rail.cmp_src')}</p><h2>${L('cmp.title')}</h2>
   <p class="legend">${L(common>1?'cmp.common_many':'cmp.common_one',{n:common,total:N})} ${L('cmp.legend')}</p>
   <div class="cmp-wrap"><table class="cmp"><thead>${head}</thead><tbody>${style}${body}</tbody></table></div></article>`}

/* ---- navigation ---- */
function show(v,push){if(!views.includes(v))v=views[0];
  $('main').innerHTML=v==='tldr'?tldrPanel():v==='vs'?vsPanel():v==='compare'?comparePanel():v==='plan'?planPanel():buildPanel(D.builds.find(b=>b.key===v));
  $('main').querySelectorAll('[data-askc]').forEach(x=>x.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(x.dataset.askc);ok=true}catch(e){}x.textContent=ok?L('inc.asked'):x.dataset.askc});
  $('main').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{show(x.dataset.go,true);scrollTo({top:0})});
  document.querySelectorAll('.pick').forEach(p=>p.setAttribute('aria-current',p.dataset.v===v));
  const cur=document.querySelector('.pick[aria-current=true]'),ul=$('list');
  if(cur&&ul.scrollWidth>ul.clientWidth)ul.scrollLeft=cur.offsetLeft-ul.offsetLeft-16;
  bindTips($('main'));bindCopy();
  document.body.classList.toggle('show-notes',NOTES);
  $('main').querySelectorAll('.notes-btn').forEach(btn=>btn.onclick=()=>{NOTES=!NOTES;try{localStorage.setItem('dl-notes',NOTES?'1':'0')}catch(e){}
    document.body.classList.toggle('show-notes',NOTES);btn.setAttribute('aria-pressed',NOTES)});
  if(push)history.replaceState(null,'','#'+v);
  try{localStorage.setItem('dl-view:'+D.hero.name,v)}catch(e){}}
$('list').addEventListener('click',e=>{const p=e.target.closest('.pick');if(p)show(p.dataset.v,true)});
document.querySelector('.tldr-btn').onclick=()=>show('tldr',true);

/* ---- copy (8 states: default/hover/focus/active/disabled/loading/error/success) ---- */
function bindCopy(){document.querySelectorAll('.copy[data-code]').forEach(btn=>btn.onclick=async()=>{
  const label=L('copy.label');btn.dataset.state='loading';btn.textContent=L('copy.loading');let ok=false;
  try{await navigator.clipboard.writeText(btn.dataset.code);ok=true}catch(e){}
  if(!ok){const t=document.createElement('textarea');t.value=btn.dataset.code;document.body.appendChild(t);t.select();
    try{ok=document.execCommand('copy')}catch(e){}t.remove()}
  btn.dataset.state=ok?'success':'error';btn.textContent=ok?L('copy.ok'):L('copy.fail');
  setTimeout(()=>{delete btn.dataset.state;btn.textContent=label},2600)})}

/* ---- tooltips: 250 ms on hover, instant on focus, tap toggles on touch ---- */
const tip=$('tip');let tmr;
function tipAbility(t){const sec=s=>`${s.d?`<div class="d">${s.d}</div>`:''}${s.imp.length?`<div class="tab__imp">${s.imp.map(p=>`<div>${p.scale?`<i title="${L('tip.spirit_scaling')}">✦ ×${p.scale}</i>`:''}<b>${p.v}</b><small>${p.label}</small></div>`).join('')}</div>`:''}
  ${s.basic.length?`<div class="tab__basic">${s.basic.map(p=>`<span><b>${p.v}</b> ${p.label}${p.scale?` <span style="color:var(--color-spirit)">✦×${p.scale}</span>`:''}</span>`).join('')}</div>`:''}`;
  const C=['var(--color-vitality)','var(--color-accent-dim)','var(--color-weapon)'],P=[1,2,5];
  return `<div class="tab"><div class="tab__h"><span class="tn">${esc(t.n)}${t.key?` <kbd>${t.key}</kbd>`:''}</span>${t.cd?`<span class="tab__cd">⟳ ${t.cd}s</span>`:''}</div>
  ${(t.range||t.charges)?`<div class="tab__chips">${t.range?`<span>◎ ${String(t.range).replace(/\s*m$/,'')} m</span>`:''}${t.charges?`<span>${t.charges} ${L('tip.charges')}</span>`:''}</div>`:''}
  ${t.secs.map(sec).join('<div class="sep"></div>')}
  ${t.ups&&t.ups.some(Boolean)?`<div class="tab__ups">${t.ups.map((u,k)=>`<div style="--c:${C[k]}"><b>◆ ${P[k]}</b>${esc(u)||'—'}</div>`).join('')}</div>`:''}
  ${t.secs.some(s=>s.imp.concat(s.basic).some(p=>p.scale))?`<div style="margin-top:6px;font-size:var(--text-xs);color:var(--color-neutral)">✦ ×N = ${L('tip.per_point')}</div>`:''}</div>`}
function tipHtml(t){if(t.ab)return tipAbility(t);let h=`<div class="h ${esc(t.slot)}"><img src="${esc(t.img||'')}" alt=""><div><div class="tn">${esc(t.n)}`
  +(t.key?`<span class="tg">${L('tip.ability')} ${t.key}${t.key===4?L('tip.ult'):''}</span>`:'')+(t.act?`<span class="tg">${L('tip.active')}</span>`:'')+'</div>'+(t.c?`<div class="tc num">${t.c} ${L('souls')}</div>`:'')+'</div></div><div class="b">';
  const st=l=>l.map(x=>`<div class="st"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  if(t.innate.length)h+=st(t.innate);
  t.blocks.forEach((b,k)=>{if(k||t.innate.length)h+='<div class="sep"></div>';if(b.d)h+=`<div class="d">${b.d}</div>`;h+=st(b.s)});
  return h+'</div>'}
function place(x,y){const r=tip.getBoundingClientRect();let l=x+16,t=y+16;
  if(l+r.width>innerWidth-8)l=x-r.width-16;if(t+r.height>innerHeight-8)t=Math.max(8,innerHeight-r.height-8);
  tip.style.left=Math.max(8,l)+'px';tip.style.top=t+'px'}
function open(el,x,y){if(!IT[el.dataset.id])return;const t=T(el.dataset.id);tip.innerHTML=(el.dataset.note?`<div class="tnote"><b>${L('tip.author_note')}</b>${esc(el.dataset.note)}</div>`:'')+tipHtml(t);tip.style.display='block';
  if(x==null){const r=el.getBoundingClientRect();x=r.right;y=r.top}place(x,y)}
function hide(){clearTimeout(tmr);tip.style.display='none'}
function heroTip(el){const h=HN(el.dataset.hero);const CL=CLS;
  return `<div class="tab"><div class="tab__h" style="justify-content:flex-start;gap:10px">${h.img?`<img src="${esc(h.img)}" alt="" style="width:40px;height:40px;border-radius:50%;background:${esc(h.color||'var(--color-shade)')}">`:''}
  <span><span class="tn">${esc(h.n)}</span>${h.type?`<br><small style="color:var(--color-muted)">${CL[h.type]||esc(h.type)}</small>`:''}</span></div>
  ${el.dataset.mu?`<div class="d" style="margin-bottom:0">${esc(el.dataset.mu)}</div>`:el.dataset.games?`<div class="d" style="margin-bottom:0">${L('tip.games_vs',{n:esc(el.dataset.games)})}</div>`:''}</div>`}
function bindHero(root){root.querySelectorAll('[data-hero]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=heroTip(el);tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),120)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindPos(root){bindHero(root);root.querySelectorAll('[data-pos]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=posTip(+el.dataset.pos);tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),150)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindTips(root){bindPos(root);root.querySelectorAll('[data-id]').forEach(el=>{
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>open(el,e.clientX,e.clientY),250)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>open(el));
  el.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){tip.style.display==='block'?hide():open(el)}});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
addEventListener('scroll',hide,{passive:true});

let start=location.hash.slice(1);
if(!views.includes(start)){try{start=localStorage.getItem('dl-view:'+D.hero.name)||''}catch(e){start=''}}
/* language switch: keep the current view when moving to the other language's page */
document.querySelectorAll('.lang a').forEach(a=>a.addEventListener('click',()=>{a.href=a.getAttribute('href').split('#')[0]+location.hash}));
if(D.contentFallback){const n=document.createElement('p');n.className='rail__note';n.textContent=L('content.fallback');$('introBox').before(n)}
renderFresh();renderRail();bindTips($('intro'));
show(start||views[0],false);
/* live check: did a patch come out after this page was generated? (API allows CORS) */
fetch('https://api.deadlock-api.com/v2/patches').then(r=>{if(!r.ok)throw 0;return r.json()}).then(list=>{LIVE='ok';
  const known=new Set(P.map(p=>Math.floor(p.t/DAY)));let added=0;
  for(const x of list){if(!/update|\d{2}-\d{2}-\d{4}|gameplay|patch/i.test(x.title||''))continue;
    const t=Date.parse(x.pub_date)/1000,d=Math.floor(t/DAY);if(known.has(d)||known.has(d-1)||known.has(d+1))continue;
    known.add(d);P.push({t,title:x.title.trim(),big:false});added++}
  renderFresh();if(added){const v=document.querySelector('.pick[aria-current=true]')?.dataset.v;renderRail();show(v||views[0],false)}
}).catch(()=>{LIVE='fail';renderFresh()});
</script>
