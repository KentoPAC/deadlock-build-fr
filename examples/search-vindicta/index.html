<script>
const D=JSON.parse(document.getElementById('data').textContent),IT=D.items;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const UI=JSON.parse($('ui').textContent),LANG=document.documentElement.lang,LOC=UI['fmt.locale'];
const L=(k,v)=>{let s=UI[k]??k;if(v)for(const[a,b]of Object.entries(v))s=s.split('{'+a+'}').join(b);return s};
const pc=n=>L('pct',{n});
const PH={'#Citadel_HeroBuilds_EarlyGame':'Early game','#Citadel_HeroBuilds_MidGame':'Mid game','#Citadel_HeroBuilds_LateGame':'Late game'};
const BUILTIN={EarlyGame:'Early game',MidGame:'Mid game',LateGame:'Late game',Early:'Early game',Mid:'Mid game',Late:'Late game',
  Lane:'Lane',Laning:'Lane',Core:'Core',Situational:L('cat.situational'),Optional:L('cat.optional'),Flex:'Flex',Utility:L('cat.utility'),Defense:L('cat.defense'),Offense:L('cat.offense')};
const catName=n=>{if(PH[n])return PH[n];const m=/^#Citadel_HeroBuilds_(.+)$/i.exec(n||'');
  return m?(BUILTIN[m[1]]||m[1].replace(/_/g,' ')):(n||L('cat.unnamed'))};
let NOTES=false;try{NOTES=localStorage.getItem('dl-notes')==='1'}catch(e){}
const T=id=>IT[id]||{};
const LINKS=(D.links||[]).slice().sort((a,b)=>b.name.length-a.name.length);
const LRE=LINKS.length?new RegExp('(?<![\\p{L}\\p{N}])('+LINKS.map(l=>esc(l.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','gu'):null;
const LBY=Object.fromEntries(LINKS.map(l=>[esc(l.name),l]));
function lk(t){const h=esc(t);if(!LRE)return h;return h.replace(LRE,m=>{const l=LBY[m];if(!l)return m;const i=IT[l.id]||{};
  const shown=m;
  return `<span class="ref ${l.key?'abil':esc(i.slot||'')}" tabindex="0" data-id="${l.id}"><img src="${esc(l.key?(i.icon||i.img):(i.img||i.icon)||'')}" alt="">${shown}${l.key?`<kbd title="${L('kbd.key',{n:l.key})}${l.key===4?L('kbd.ult'):''}">${l.key}</kbd>`:''}</span>`})}
function img(id,cls){const i=IT[id]||{};return `<img class="${cls||''}" src="${esc(i.img||i.icon||'')}" data-alt="${esc(i.icon||'')}" alt="" loading="lazy" onerror="fb(this)">`}
function fb(el){if(el.dataset.alt&&el.src!==el.dataset.alt)el.src=el.dataset.alt;else el.style.visibility='hidden'}

/* ---- header ---- */
const H=D.hero;
if(H.color){const R=document.documentElement.style;R.setProperty('--color-hero',H.color);
  const [r,g,b]=[1,3,5].map(k=>parseInt(H.color.slice(k,k+2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);
  if(.2126*r+.7152*g+.0722*b>.35)R.setProperty('--tag-ink','var(--color-shade)')}
if(H.nameSvg){const n=new Image();n.alt=H.name;n.src=H.nameSvg;n.onerror=()=>{$('title').textContent=H.name};$('title').append(n)}
else $('title').textContent=H.name;
$('heroImg').src=H.portrait||H.image||'';$('heroImg').onerror=function(){if(H.image&&this.src!==H.image)this.src=H.image};
const bg=$('heroBg');bg.src=H.bg||'../_assets/banner.webp';if(!H.bg)bg.className='fallback';
bg.onerror=function(){if(!this.classList.contains('fallback')){this.className='fallback';this.src='../_assets/banner.webp'}else this.remove()};
$('tags').innerHTML=(H.tags||[]).map(t=>`<li>${esc(t)}</li>`).join('');
document.title=L('doc.title',{hero:H.name});
$('intro').innerHTML=lk(D.intro||'');if(!D.intro)$('introBox').hidden=true;else if(matchMedia('(max-width:900px)').matches)$('introBox').open=false;
$('foot').textContent=L('foot');

/* ---- freshness: everything is computed against today's date, at view time ---- */
const DAY=86400,NOW=()=>Date.now()/1000;
let P=(D.patches||[]).slice(),LIVE='pending';
const fmt=t=>new Date(t*1000).toLocaleDateString(LOC);
function ago(t){const day=x=>{const d=new Date(x);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5};
  const d=Math.round(day(Date.now())-day(t*1000));
  return d<=0?L('ago.today'):d===1?L('ago.yesterday'):d<45?L('ago.days',{n:d}):d<540?L('ago.months',{n:Math.round(d/30)}):L('ago.years',{n:Math.round(d/365)})}
const after=(t,big)=>P.filter(p=>p.t>t&&p.t<=NOW()&&(big==null||p.big===big)).sort((a,b)=>a.t-b.t);
function pageFresh(){const pa=after(D.generatedTs),age=(NOW()-D.generatedTs)/DAY;
  if(pa.length){const l=pa[pa.length-1];return{lvl:'bad',stamp:L('stamp.patch'),main:pa.length>1?L('fresh.patch_many',{n:pa.length}):L('fresh.patch_one'),
    sub:L('fresh.patch_sub',{title:l.title,date:fmt(l.t)})}}
  const miss=((D.completeness||{}).missing||[]);if(miss.length)return{lvl:'warn',stamp:L('stamp.outdated'),main:L('fresh.incomplete',{ago:ago(D.generatedTs)}),sub:L('fresh.missing',{list:miss.slice(0,4).join(', ')+(miss.length>4?'…':'')})};const pend=((D.completeness||{}).pending||[]);if(pend.length)return{lvl:'warn',stamp:L('stamp.method'),main:L('fresh.old_method',{v:D.completeness.version}),sub:L('fresh.new',{list:pend.map(x=>x.title).join(', ')})};
  if(age>7)return{lvl:'warn',stamp:L('stamp.check'),main:L('fresh.fetched',{ago:ago(D.generatedTs)}),sub:L('fresh.trends')};
  return{lvl:'ok',stamp:L('stamp.ok'),main:L('fresh.fetched',{ago:ago(D.generatedTs)}),sub:L('fresh.on',{date:fmt(D.generatedTs)})+(LIVE==='ok'?L('fresh.live_ok'):LIVE==='fail'?L('fresh.live_fail'):L('fresh.live_pending'))}}
function buildFresh(b){
  if(b.source==='OTP'){const bigIn=P.filter(p=>p.big&&p.t>D.since&&p.t<D.generatedTs);
    if(bigIn.length)return{lvl:'warn',v:L('days.short',{n:Math.round((D.generatedTs-D.since)/DAY)}),s:L('bf.mixed',{date:fmt(bigIn[0].t)})};
    return{lvl:'ok',v:L('days.short',{n:Math.round((D.generatedTs-D.since)/DAY)}),s:L('bf.since',{date:fmt(D.since)})}}
  if(!b.updated)return{lvl:'',v:'—',s:L('bf.unknown')};
  const big=after(b.updated,true),minor=after(b.updated,false);
  if(big.length>=2)return{lvl:'bad',v:ago(b.updated),s:L('bf.many_big',{n:big.length,date:fmt(big[big.length-1].t)})};
  if(big.length)return{lvl:'warn',v:ago(b.updated),s:L('bf.one_big',{date:fmt(big[0].t)})};
  if(minor.length)return{lvl:'ok',v:ago(b.updated),s:minor.length>1?L('bf.minor_many',{n:minor.length}):L('bf.minor_one')};
  return{lvl:'ok',v:ago(b.updated),s:L('bf.latest')}}
const wrTone=w=>w==null?'none':w>=55?'good':w<50?'bad':'mid';
const flag=f=>f.lvl==='bad'?`<i class="flag flag--bad" title="${L('flag.bad')}">⛔</i>`:f.lvl==='warn'?`<i class="flag flag--warn" title="${L('flag.warn')}">⚠</i>`:'';
const srcName=s=>L('src.'+s);
const ts=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
const vlink=(id,t,text)=>`<a href="https://www.youtube.com/watch?v=${esc(id)}${t?`&amp;t=${t}s`:''}" target="_blank" rel="noopener">${text}</a>`;
function renderFresh(){const f=pageFresh(),el=$('fresh');el.dataset.lvl=f.lvl;
  el.innerHTML=`<span class="stamp">${esc(f.stamp)}</span><span class="fresh__txt"><b>${esc(f.main)}</b><br>${esc(f.sub)}</span>`}

/* ---- rail ---- */
const HASPLAN=!!(D.plan||D.baseline||(D.guides&&D.guides.guides&&D.guides.guides.length));
const HASVS=!!((D.plan||{}).vs||(D.plan||{}).weaknesses||D.matchups||(D.videoTips||[]).length);
const views=['tldr'].concat(D.builds.map(b=>b.key),HASPLAN?['plan']:[],HASVS?['vs']:[],D.builds.length>1?['compare']:[]);
function renderRail(){$('list').innerHTML=D.builds.map(b=>{const f=buildFresh(b),t=wrTone(b.winrate);
  const sub=[b.rank?rankImg(b,'rank--sm')+esc(b.rank):'',b.winrate!=null?`<span class="wr-${t}">${L('wr.short',{n:b.winrate})}</span>`:b.favorites?L('fav.short',{n:b.favorites}):''].filter(Boolean).join(' · ');
  return `<li><button class="pick cham" data-v="${esc(b.key)}">
  <span class="pick__src">${esc(srcName(b.source))}${flag(f)}</span><span class="pick__who">${esc(b.author)}</span>
  <span class="pick__sub">${sub}</span></button></li>`}).join('')
 +(HASPLAN?`<li><button class="pick pick--compare cham" data-v="plan"><span class="pick__src">${L('rail.plan_src')}</span>
  <span class="pick__who">${L('rail.plan')}</span><span class="pick__sub">${L('rail.plan_sub')}</span></button></li>`:'')
 +(HASVS?`<li><button class="pick pick--compare cham" data-v="vs"><span class="pick__src">${L('rail.vs_src')}</span><span class="pick__who">${L('rail.vs')}</span><span class="pick__sub">${L('rail.vs_sub')}</span></button></li>`:'')
 +(D.builds.length>1?`<li><button class="pick pick--compare cham" data-v="compare"><span class="pick__src">${L('rail.cmp_src')}</span>
  <span class="pick__who">${L('rail.cmp')}</span><span class="pick__sub">${L('rail.cmp_sub')}</span></button></li>`:'');}

/* ---- build panel ---- */
const ROMAN=['','I','II','III','IV','V'];
function gcard(id){const i=T(id);
  return `<div class="gcard${i.act?' gcard--active':''}">${img(id,'gcard__art')}${i.tier?`<span class="gcard__tier">${ROMAN[i.tier]||i.tier}</span>`:''}
  ${i.imb?'<i class="gcard__imbue">IMBUE</i>':''}<div class="gcard__name">${esc(i.n||id)}</div></div>`}
function modCard(m,num){const i=T(m.id);
  let chips='';
  if(m.pct!=null)chips=`<div class="mod__chips"><span class="chip chip--hi num">${pc(m.pct)}</span><span class="chip num">${m.min} min</span>`
    +(m.sold!=null?`<span class="chip" title="${L('mod.sold_title',{n:m.sold})}">${L('mod.sold',{n:m.sold})}</span>`:'')+'</div>';
  return `<div class="mod ${esc(i.slot||'')}" tabindex="0" data-id="${m.id}"${m.note?` data-note="${esc(m.note)}"`:''}>${num?`<span class="nmark">${num}</span>`:''}${gcard(m.id)}${chips}</div>`}

function abilityGrid(order){if(!order.length)return'';
  const ids=[...new Set(order.map(o=>o.id))],lvl={};
  const head='<tr><th></th>'+order.map((_,k)=>`<th class="num">${k+1}</th>`).join('')+'</tr>';
  const cells={};order.forEach((o,k)=>{lvl[o.id]=(lvl[o.id]??-1)+1;cells[o.id+':'+k]=lvl[o.id]});
  const rows=ids.map(id=>`<tr><th><div tabindex="0" data-id="${id}">${img(id)}${esc(T(id).n||id)}${IT[id]&&IT[id].key?`<kbd>${IT[id].key}</kbd>`:''}</div></th>`
    +order.map((_,k)=>{const v=cells[id+':'+k];return v==null?'<td></td>':v===0?`<td class="u" title="${L('grid.unlock')}">◇</td>`:`<td class="p num" title="${L('grid.upgrade',{n:v})}">${v}</td>`}).join('')+'</tr>').join('');
  return `<section class="phase"><h3>${L('grid.title')}</h3><p class="phase__desc">${L('grid.desc')}</p>
  <div class="grid-wrap"><table class="abil"><thead>${head}</thead><tbody>${rows}</tbody></table></div></section>`}

const cap=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
function takeBlock(b){if(!b.resume&&!(b.points||[]).length)return'';
  const rows=(b.points||[]).map(p=>{const m=p.match(/^([^:]{1,26}?)\s*:\s*(.+)$/s);
    const lab=m&&!/[.,;!?]/.test(m[1])?m[1].trim():'',txt=lab?m[2]:p;
    return `<li><span class="lbl${lab?'':' lbl--none'}" title="${esc(lab)}">${esc(lab)}</span><p>${lk(cap(txt.trim()))}</p></li>`}).join('');
  return `<div class="take cham"><span class="take__k">${L('take.label')}</span>${b.resume?`<p class="take__lead">${lk(b.resume)}</p>`:''}${rows?`<ul class="take__pts">${rows}</ul>`:''}</div>`}

const rankImg=(b,cls)=>b.rankImg?`<img class="rank ${cls}" src="${esc(b.rankImg)}" alt="" loading="lazy" onerror="this.remove()">`:'';
const SRC=['lane','jungle','fights','obj'].map(k=>[k,L('srcbar.'+k)]);
const bar=(src,cls)=>`<div class="bar ${cls||''}">${SRC.map(([k])=>`<span class="${k}" style="width:${src[k]||0}%" title="${k} ${src[k]||0} %"></span>`).join('')}</div>`;
function delta(v,b,inv){if(b==null||!b)return'';const r=v/b;if(Math.abs(r-1)<.1)return'';
  const good=inv?r<1:r>1;return ` <span class="${good?'up':'down'}">${r>1?'▲':'▼'}${Math.round(Math.abs(r-1)*100)} %</span>`}
function playRows(p){const B=(D.baseline||{}).phases||[];
  return p.phases.map((ph,i)=>{const b=B[i]||{};return `<div class="prow"><div class="prow__ph">${esc(ph.name)}<small>${ph.from}–${ph.to} min</small></div>
  <div>${bar(ph.src)}${b.src?bar(b.src,'bar--base'):''}</div>
  <div class="prow__nums"><b class="num">${ph.spm}</b> ${L('play.spm')}${delta(ph.spm,b.spm)} · ${L('play.jungle')} <b class="num">${pc(ph.src.jungle)}</b>${b.src?` (${L('play.avg',{x:pc(b.src.jungle)})})`:''}<br>
  K/D/A <b class="num">${ph.kpm}/${ph.dpm}/${ph.apm}</b> ${L('play.per10')} · ${L('play.deaths')}${delta(ph.dpm,b.dpm,true)||' ='} · ${L('play.assists')}${delta(ph.apm,b.apm)||' ='}<br>
  ${L('play.hero_dmg')} <b class="num">${ph.hero_dmg}</b>/min${delta(ph.hero_dmg,b.hero_dmg)} · ${L('play.obj')} <b class="num">${ph.obj_dmg}</b>/min${delta(ph.obj_dmg,b.obj_dmg)}</div></div>`}).join('')}
const legendSrc=base=>`<div class="legend-src">${SRC.map(([k,l])=>`<span><i class="bar ${k}" style="background:var(--src-${k})"></i>${l}</span>`).join('')}${base?`<span>${L('play.legend_base',{hero:esc(D.hero.name)})}</span>`:''}</div>`;
const tag=t=>(UI.style_tags||{})[t]||t;
// Per-phase lean of a build's author (playstyle.py "focus"): lane / jungle farm, fights, objectives, or balanced.
const leanTxt=f=>f.lean.length?f.lean.map(x=>`${L('focus.'+x.k)}&nbsp;<i>${L('focus.gap',{n:x.gap})}</i>`).join(', '):L('focus.balanced');
function focusBlock(b,count){const p=b.play;if(!p||!p.focus)return'';
  const n=p.matches?`<p class="focus__n">${L('focus.games',{n:p.matches})}${p.matches<20?` · <b>${L('focus.small')}</b>`:''}</p>`:'';
  return `<div class="focus">${p.focus.map(f=>`<div class="focus__ph${f.lean.length?'':' focus__ph--bal'}"><b>${f.phase}</b><span>${leanTxt(f)}</span></div>`).join('')}</div>${count?n:''}`}
function playSection(b){if(!b.play)return'';
  return `${b.play.focus?`<section class="phase"><h3>${L('focus.title')}</h3><p class="phase__desc">${L('focus.desc',{hero:esc(D.hero.name)})}</p>${focusBlock(b,true)}</section>`:''}
  <section class="phase"><h3>${L('play.title')}</h3><p class="phase__desc">${L('play.desc',{hero:esc(D.hero.name),date:fmt(D.since)})}</p>
  <div class="play__tags">${(b.play.tags.length?b.play.tags.map(tag):[L('play.close')]).map(t=>`<span class="ptag${b.play.tags.length?'':' ptag--none'}">${esc(t)}</span>`).join('')}</div>
  ${playRows(b.play)}${legendSrc(true)}</section>`}
function planPanel(){const P_=D.plan||{},G=(D.guides&&D.guides.guides)||[],measured=D.builds.filter(b=>b.play);
  const phases=[['early','Early'],['mid','Mid'],['late','Late']].filter(([k])=>P_[k]);
  const table=measured.length?`<div class="cmp-wrap"><table class="cmp ptable"><thead><tr><th>${L('plan.player')}</th><th>${L('plan.measured_style')}</th><th>Early</th><th>Mid</th><th>Late</th></tr></thead><tbody>
    ${measured.map(b=>`<tr><th>${esc(b.author)}<small style="display:block;color:var(--color-neutral)">${esc(b.rank||'')}</small></th><td>${esc(b.play.tags.map(tag).join(', ')||L('play.close_lc'))}</td>
    ${b.play.phases.map((ph,i)=>`<td style="min-width:150px">${bar(ph.src)}<span class="num" style="font-size:var(--text-xs);color:var(--color-muted)">${ph.spm} ${L('play.spm')} · K/D/A ${ph.kpm}/${ph.dpm}/${ph.apm}<br>${L('play.hero_dmg_short')} ${ph.hero_dmg}/min${(()=>{const B=((D.baseline||{}).phases||[])[i]||{};return delta(ph.hero_dmg,B.hero_dmg)})()}</span></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>${legendSrc()}`:'';
  const vids=(D.guideVideos||[]).map(v=>`<li><b>${esc(v.title)}</b> — ${L('plan.video')} · ${esc(v.author)} · ${vlink(v.id,0,L('plan.watch'))} · ${new Date(v.date).toLocaleDateString(LOC)}</li>`).join('');
  const srcs=vids+G.map(g=>`<li><b>${esc(g.title)}</b> — ${g.kind==='steam'?`${L('plan.steam')} · <a href="${esc(g.url)}" target="_blank" rel="noopener">${L('plan.read')}</a>`:`${L('plan.build_by',{author:esc(g.author||'?')})} (${esc(g.rank||'')}${g.favorites?`, ${g.favorites} fav.`:''})${g.build_id?` · build <span class="num">${g.build_id}</span>`:''}`} · ${fmt(g.updated)}</li>`).join('');
  return `<article class="panel"><p class="panel__src">${L('plan.kicker')}</p><h2>${L('plan.title',{hero:esc(D.hero.name)})}</h2>
   <p class="facts">${L('plan.desc')}</p>
   ${P_.lane?`<section class="phase"><h3>${L('tl.lane')}</h3><p class="role__txt">${lk(P_.lane)}</p></section>`:''}
   ${phases.length?`<div class="plan">${phases.map(([k,l])=>`<div class="plan__ph cham"><h3>${l}</h3><p>${lk(P_[k])}</p></div>`).join('')}</div>`:''}
   ${(P_.tips||[]).length?`<ul class="tips">${P_.tips.map(t=>`<li>${lk(t)}</li>`).join('')}</ul>`:''}
   ${(D.roles||P_.role)?`<section class="phase"><h3>${L('sec.role')}</h3>${roleBlock(true)}</section>`:''}
   ${swBlock(true)?`<section class="phase"><h3>${L('sec.sw')}</h3>${swBlock(true)}</section>`:''}
   ${D.counterplay?`<section class="phase"><h3>${L('sec.counterplay')}</h3><p class="phase__desc">${L('sec.counterplay_desc')}</p>${counterplay(false)}</section>`:''}
   ${K().abilities.length?`<section class="phase"><h3>${L('sec.abilities')}</h3><p class="phase__desc">${L('sec.abilities_desc')}</p>${abilityCards(true)}</section>`:''}
   ${K().spikes.length?`<section class="phase"><h3>${L('sec.spikes')}</h3><p class="phase__desc">${L('sec.spikes_desc',{ref:esc(K().ref||'')})}</p>${spikesTable()}</section>`:''}
   ${table?`<section class="phase"><h3>${L('sec.best')}</h3>${table}</section>`:''}
   <section class="phase"><h3>${L('sec.sources')}</h3><ul class="srcs">${srcs||`<li>${L('plan.no_guide')}</li>`}
   ${measured.map(b=>`<li><b>${L('plan.stats_of',{author:esc(b.author)})}</b> — ${L('plan.games_since',{date:fmt(D.since)})}</li>`).join('')}</ul></section></article>`}
function pickBuild(){const t=D.tldr||{};return D.builds.find(b=>b.key===t.pick)||D.builds.find(b=>b.code&&b.source==='OTP')||D.builds.find(b=>b.code)||D.builds[0]}
const K=()=>D.kit||{abilities:[],spikes:[],core:[]};
function spikeGroups(){const g=[];for(const s of K().spikes){const last=g[g.length-1];if(last&&last.souls===s.souls)last.items.push(s);else g.push({souls:s.souls,min:s.min,items:[s]})}return g}
const tierLbl=s=>s.kind==='item'?L('tier.item'):s.tier?`T${s.tier}`:L('tier.unlock');
const kOf=id=>(IT[id]||{}).key;
function spikesCompact(){const S=K().spikes,big=S.filter(s=>s.kind==='item'||s.tier===3);return `<div class="spk">${(big.length?big:S).slice(0,10).map(s=>`<span class="spk__i" tabindex="0" data-id="${s.id}">${img(s.id)}<span>${esc(T(s.id).n)}${kOf(s.id)?` <kbd>${kOf(s.id)}</kbd>`:''} <span class="t">${tierLbl(s)}</span><br><small>${(s.souls/1000).toLocaleString(LOC)}${L('k_souls')}${s.min!=null?` · ≈ ${Math.round(s.min)} min`:''}</small></span></span>`).join('')}</div>`}
function spikesTable(){const S=K().spikes,byMin=S.every(s=>s.min!=null);
  const x=s=>byMin?s.min:s.souls/1000,unit=byMin?' min':'k',top=Math.max(5,Math.ceil(Math.max(...S.map(x))/5)*5),step=top<=20?5:10;
  const pct=v=>(Math.min(v,top)/top*100).toFixed(2)+'%',when=s=>`≈ ${Math.round(x(s))}${unit}`;
  const lvl=s=>s.kind==='item'?L('spk.item',{pct:s.pct}):s.tier===0?L('spk.new'):s.tier===3?'Max':L('spk.tier',{n:s.tier});
  const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  const guides=ticks.slice(1,-1).map(v=>`<i class="spl__g" style="--x:${pct(v)}"></i>`).join('');
  const lanes=K().abilities.map(a=>{const ev=S.filter(s=>s.id===a.id);if(!ev.length)return '';
    return `<div class="spl__r"><span class="spl__k" tabindex="0" data-id="${a.id}">${img(a.id)}<kbd>${a.key}</kbd></span><div class="spl__tr">${guides}<i class="spl__bar" style="--x:${pct(x(ev[0]))}"></i>${ev.map(s=>`<i class="spl__m t${s.tier}" style="--x:${pct(x(s))}" title="${esc(T(s.id).n)} · ${lvl(s)} · ${when(s)}">${s.tier||''}</i>`).join('')}</div></div>`}).join('')
    +(()=>{const it=S.filter(s=>s.kind==='item');return it.length?`<div class="spl__r"><span class="spl__k spl__k--it">${L('spk.items')}</span><div class="spl__tr">${guides}${it.map(s=>`<i class="spl__m it" style="--x:${pct(x(s))}" title="${esc(T(s.id).n)} · ${lvl(s)} · ${when(s)}">${img(s.id)}</i>`).join('')}</div></div>`:''})();
  const overview=`<div class="spl" aria-hidden="true">${lanes}<div class="spl__r spl__ax"><span></span><div class="spl__tr">${ticks.map(v=>`<span style="--x:${pct(v)}">${v}${v===top?unit:''}</span>`).join('')}</div></div>
    <p class="spl__lg"><span><i class="spl__m t0"></i>${L('spk.lg_unlock')}</span><span><i class="spl__m t1">1</i><i class="spl__m t2">2</i>${L('spk.lg_tiers')}</span><span><i class="spl__m t3">3</i>${L('spk.lg_max')}</span>${S.some(s=>s.kind==='item')?`<span><i class="spl__m it"></i>${L('spk.lg_item')}</span>`:''}</p></div>`;
  const PH=[[10,'Early game',L('spk.ph_early')],[20,'Mid game',L('spk.ph_mid')],[1e9,'Late game',L('spk.ph_late')]];
  let ph=-1;const rows=spikeGroups().map(g=>{let head='';
    if(byMin){const i=PH.findIndex(p=>g.min<p[0]);if(i!==ph){ph=i;head=`<li class="spt__ph">${PH[i][1]} <small>${PH[i][2]}</small></li>`}}
    const ev=g.items.map(s=>{if(s.kind==='item')return `<div class="spt__e it">${img(s.id)}<div><div class="spt__h"><span class="ref ${esc(T(s.id).slot||'')}" tabindex="0" data-id="${s.id}">${esc(T(s.id).n)}</span><span class="spt__lv">${lvl(s)}</span></div><ul class="spt__fx"><li>${s.cost.toLocaleString(LOC)} ${L('souls')}</li></ul></div></div>`;const fx=(s.text||'').split(' · ').filter(Boolean);
      return `<div class="spt__e t${s.tier}">${img(s.id)}<div><div class="spt__h"><span class="ref abil" tabindex="0" data-id="${s.id}">${esc(T(s.id).n)}${kOf(s.id)?`<kbd>${kOf(s.id)}</kbd>`:''}</span>
      ${s.tier?`<span class="pips" aria-hidden="true">${[1,2,3].map(k=>`<i class="${k<=s.tier?'on':''}"></i>`).join('')}</span>`:''}<span class="spt__lv">${lvl(s)}</span></div>
      ${fx.length?`<ul class="spt__fx">${fx.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}</div></div>`}).join('');
    return `${head}<li class="spt__n${g.items.some(s=>s.tier===3)?' is-max':''}"><div class="spt__t">${g.min!=null?`<b>${Math.round(g.min)} min</b>`:''}<small><span class="lg">${g.souls.toLocaleString(LOC)}</span><span class="sh">${(g.souls/1000).toLocaleString(LOC,{maximumFractionDigits:1})}k</span> ${L('souls')}</small></div><div class="spt__c">${ev}</div></li>`}).join('');
  return `${overview}<ol class="spt">${rows}</ol>`}
function abilityCards(full){const P_=(D.plan||{}).abilities||{},fm=K().firstMax;
  return `<div class="abl">${K().abilities.map(a=>`<div class="abl__c cham" tabindex="0" data-id="${a.id}"><div class="abl__h">${img(a.id)}<b>${esc(T(a.id).n)}</b><kbd>${a.key}</kbd></div>
  ${a.id===fm?`<span class="abl__first">${L('abl.first')}</span>`:''}
  ${P_[a.key]?`<p class="how">${lk(P_[a.key])}</p>`:''}
  ${full?(()=>{const t=T(a.id),st=(t.secs||[]).flatMap(s=>s.imp.concat(s.basic));return `<p>${esc(a.desc)}</p>${(t.cd||st.length)?`<div class="tab__basic">${t.cd?`<span>⟳ <b>${t.cd}s</b></span>`:''}${st.map(p=>`<span><b>${p.v}</b> ${esc(p.label)}${p.scale?` <span style="color:var(--color-spirit)">✦×${p.scale}</span>`:''}</span>`).join('')}</div>`:''}<ol>${a.tiers.map((x,k)=>`<li><b style="color:var(--color-accent)">${[1,2,5][k]} pt${k?'s':''}</b> · ${esc(x)||'—'}</li>`).join('')}</ol>`})():''}</div>`).join('')}</div>`}
function tldrPanel(){const t=D.tldr||{},P_=D.plan||{},b=pickBuild(),f=buildFresh(b),k=K();
  const btn=b.code?`<button class="copy cham" data-code="${esc(b.code)}">${L('copy.label')}</button>`:`<button class="copy cham" disabled>${L('copy.todo')}</button>`;
  const ph=[['early','Early'],['mid','Mid'],['late','Late']].map(([x,l])=>[l,t[x]||P_[x]]).filter(x=>x[1]);
  const keys=t.keys||(P_.tips||[]).slice(0,3);
  const C=D.completeness||{},PD=C.pending||[];const inc=((C.missing||[]).length||PD.length)?`<div class="incomplete"><p><b>${L('inc.title')}</b> — ${PD.length?L('inc.method',{a:C.version,b:C.current}):L('inc.older')}</p>
    ${PD.length?`<ul>${PD.map(x=>`<li><b>v${x.version} · ${esc(x.title)}</b> (${new Date(x.date).toLocaleDateString(LOC)})</li>`).join('')}</ul>`:''}
    ${(C.missing||[]).length?`<p>${L('inc.missing',{list:esc(C.missing.join(', '))})}</p>`:''}<button type="button" data-askc="${esc(C.ask||'')}">${L('inc.ask')}</button></div>`:'';
  return `<article class="panel">${inc}
  <div class="tl-hero cham"><div><span class="tl-k">${L('tl.take')}</span><div class="tl-name">${esc(b.name)}</div>
    <div class="tl-meta">${b.rankImg?`<img class="rank rank--sm" src="${esc(b.rankImg)}" alt="">`:''}<b style="color:var(--color-ink)">${esc(b.author)}</b>${b.rank?` · ${esc(b.rank)}`:''}${b.winrate!=null?` · <span class="wr-${wrTone(b.winrate)}">${L('wr.long',{n:b.winrate})}</span>`:''} · ${esc(srcName(b.source))}${flag(f)}</div>
    ${t.why?`<p class="tl-why">${lk(t.why)}</p>`:''}${focusBlock(b,true)}</div>${btn}</div>
  ${(D.roles||(D.plan||{}).role)?`<section class="tl-sec"><h3>${L('tl.role')}</h3>${roleBlock(false)}</section>`:''}
  ${k.core.length?`<section class="tl-sec"><h3>${L('tl.core')} · ${esc(k.ref||'')}</h3><div class="tl-items">${k.core.map(c=>`<div class="mod ${esc(T(c.id).slot||'')}" tabindex="0" data-id="${c.id}">${gcard(c.id)}<span class="tl-min">≈ ${c.min} min</span></div>`).join('')}</div></section>`:''}
  ${P_.lane?`<section class="tl-sec"><h3>${L('tl.lane')}</h3><p class="tl-why">${lk(P_.lane)}</p></section>`:''}
  ${ph.length?`<section class="tl-sec"><h3>${L('tl.plan')}</h3><div class="tl-phases">${ph.map(([l,x])=>`<div><b>${l}</b><p>${lk(x)}</p></div>`).join('')}</div></section>`:''}

/* ---- comparison ---- */
const KW=[[/situ|option|util|selon|counter|contre|si /i,'Situ.',8],[/late|fin de partie|tardi|endgame/i,'Late',2],
  [/mid|milieu/i,'Mid',1],[/early|lane|début|premier|core|base|start/i,'Early',0]];
function phaseOf(c,idx){const n=PH[c.name]?c.name:catName(c.name);if(PH[n])return[PH[n].replace(' game',''),idx];
  for(const[re,lab,r]of KW)if(re.test(n))return[lab,r];return[`Cat. ${idx+1}`,idx+0.5]}
function comparePanel(){
  const rows={};D.builds.forEach((b,bi)=>b.cats.forEach((c,ci)=>{const[lab,rank]=phaseOf(c,ci);
    c.mods.forEach(m=>{const r=rows[m.id]=rows[m.id]||{id:m.id,cells:{},rank:0,n:0};
      if(r.cells[bi]==null){r.cells[bi]={lab,full:catName(c.name),p:rank,raw:c.name};r.n++;r.rank+=rank}})}));
  const N=D.builds.length,list=Object.values(rows).sort((a,b)=>b.n-a.n||a.rank/a.n-b.rank/b.n);
  const head=`<tr><th>${L('cmp.item')}</th>`+D.builds.map(b=>`<th>${esc(b.author)}${flag(buildFresh(b))}<small>${esc(srcName(b.source))}${b.winrate!=null?` · <span class="wr-${wrTone(b.winrate)}">${L('wr.short',{n:b.winrate})}</span>`:''}</small></th>`).join('')+`<th class="cnt">${L('cmp.builds')}</th></tr>`;
  const body=list.map(r=>`<tr class="${r.n===N?'all':''}"><th><div tabindex="0" data-id="${r.id}">${img(r.id)}${esc(T(r.id).n||r.id)}</div></th>`
    +D.builds.map((_,bi)=>{const c=r.cells[bi];return c?`<td class="ph" data-p="${c.p<3?0:1}" title="${esc(c.full)}">${esc(c.lab)}${PH[c.raw]||/^Situ/.test(c.raw||'')?'':'<i>*</i>'}</td>`:'<td class="none">—</td>'}).join('')
    +`<td class="cnt num">${r.n}/${N}</td></tr>`).join('');
  const styled=D.builds.some(b=>b.play&&b.play.focus);
  const style=styled?['Early','Mid','Late'].map((ph,i)=>`<tr class="cmp-style"><th>${L('focus.title')} · ${ph}</th>`+D.builds.map(b=>{const f=b.play&&b.play.focus&&b.play.focus[i];
    return f?`<td>${leanTxt(f)}</td>`:'<td class="none">—</td>'}).join('')+'<td class="cnt"></td></tr>').join(''):'';
  const common=list.filter(r=>r.n===N).length;
  return `<article class="panel"><p class="panel__src">${L('rail.cmp_src')}</p><h2>${L('cmp.title')}</h2>
   <p class="legend">${L(common>1?'cmp.common_many':'cmp.common_one',{n:common,total:N})} ${L('cmp.legend')}</p>
   <div class="cmp-wrap"><table class="cmp"><thead>${head}</thead><tbody>${style}${body}</tbody></table></div></article>`}

/* ---- navigation ---- */
function show(v,push){if(!views.includes(v))v=views[0];
  $('main').innerHTML=v==='tldr'?tldrPanel():v==='vs'?vsPanel():v==='compare'?comparePanel():v==='plan'?planPanel():buildPanel(D.builds.find(b=>b.key===v));
  $('main').querySelectorAll('[data-askc]').forEach(x=>x.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(x.dataset.askc);ok=true}catch(e){}x.textContent=ok?L('inc.asked'):x.dataset.askc});
  $('main').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{show(x.dataset.go,true);scrollTo({top:0})});
  document.querySelectorAll('.pick').forEach(p=>p.setAttribute('aria-current',p.dataset.v===v));
  const cur=document.querySelector('.pick[aria-current=true]'),ul=$('list');
  if(cur&&ul.scrollWidth>ul.clientWidth)ul.scrollLeft=cur.offsetLeft-ul.offsetLeft-16;
  bindTips($('main'));bindCopy();
  document.body.classList.toggle('show-notes',NOTES);
  $('main').querySelectorAll('.notes-btn').forEach(btn=>btn.onclick=()=>{NOTES=!NOTES;try{localStorage.setItem('dl-notes',NOTES?'1':'0')}catch(e){}
    document.body.classList.toggle('show-notes',NOTES);btn.setAttribute('aria-pressed',NOTES)});
  if(push)history.replaceState(null,'','#'+v);
  try{localStorage.setItem('dl-view:'+D.hero.name,v)}catch(e){}}
$('list').addEventListener('click',e=>{const p=e.target.closest('.pick');if(p)show(p.dataset.v,true)});
document.querySelector('.tldr-btn').onclick=()=>show('tldr',true);

/* ---- copy (8 states: default/hover/focus/active/disabled/loading/error/success) ---- */
function bindCopy(){document.querySelectorAll('.copy[data-code]').forEach(btn=>btn.onclick=async()=>{
  const label=L('copy.label');btn.dataset.state='loading';btn.textContent=L('copy.loading');let ok=false;
  try{await navigator.clipboard.writeText(btn.dataset.code);ok=true}catch(e){}
  if(!ok){const t=document.createElement('textarea');t.value=btn.dataset.code;document.body.appendChild(t);t.select();
    try{ok=document.execCommand('copy')}catch(e){}t.remove()}
  btn.dataset.state=ok?'success':'error';btn.textContent=ok?L('copy.ok'):L('copy.fail');
  setTimeout(()=>{delete btn.dataset.state;btn.textContent=label},2600)})}

/* ---- tooltips: 250 ms on hover, instant on focus, tap toggles on touch ---- */
const tip=$('tip');let tmr;
function tipAbility(t){const sec=s=>`${s.d?`<div class="d">${s.d}</div>`:''}${s.imp.length?`<div class="tab__imp">${s.imp.map(p=>`<div>${p.scale?`<i title="${L('tip.spirit_scaling')}">✦ ×${p.scale}</i>`:''}<b>${p.v}</b><small>${p.label}</small></div>`).join('')}</div>`:''}
  ${s.basic.length?`<div class="tab__basic">${s.basic.map(p=>`<span><b>${p.v}</b> ${p.label}${p.scale?` <span style="color:var(--color-spirit)">✦×${p.scale}</span>`:''}</span>`).join('')}</div>`:''}`;
  const C=['var(--color-vitality)','var(--color-accent-dim)','var(--color-weapon)'],P=[1,2,5];
  return `<div class="tab"><div class="tab__h"><span class="tn">${esc(t.n)}${t.key?` <kbd>${t.key}</kbd>`:''}</span>${t.cd?`<span class="tab__cd">⟳ ${t.cd}s</span>`:''}</div>
  ${(t.range||t.charges)?`<div class="tab__chips">${t.range?`<span>◎ ${String(t.range).replace(/\s*m$/,'')} m</span>`:''}${t.charges?`<span>${t.charges} ${L('tip.charges')}</span>`:''}</div>`:''}
  ${t.secs.map(sec).join('<div class="sep"></div>')}
  ${t.ups&&t.ups.some(Boolean)?`<div class="tab__ups">${t.ups.map((u,k)=>`<div style="--c:${C[k]}"><b>◆ ${P[k]}</b>${esc(u)||'—'}</div>`).join('')}</div>`:''}
  ${t.secs.some(s=>s.imp.concat(s.basic).some(p=>p.scale))?`<div style="margin-top:6px;font-size:var(--text-xs);color:var(--color-neutral)">✦ ×N = ${L('tip.per_point')}</div>`:''}</div>`}
function tipHtml(t){if(t.ab)return tipAbility(t);let h=`<div class="h ${esc(t.slot)}"><img src="${esc(t.img||'')}" alt=""><div><div class="tn">${esc(t.n)}`
  +(t.key?`<span class="tg">${L('tip.ability')} ${t.key}${t.key===4?L('tip.ult'):''}</span>`:'')+(t.act?`<span class="tg">${L('tip.active')}</span>`:'')+'</div>'+(t.c?`<div class="tc num">${t.c} ${L('souls')}</div>`:'')+'</div></div><div class="b">';
  const st=l=>l.map(x=>`<div class="st"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  if(t.innate.length)h+=st(t.innate);
  t.blocks.forEach((b,k)=>{if(k||t.innate.length)h+='<div class="sep"></div>';if(b.d)h+=`<div class="d">${b.d}</div>`;h+=st(b.s)});
  return h+'</div>'}
function place(x,y){const r=tip.getBoundingClientRect();let l=x+16,t=y+16;
  if(l+r.width>innerWidth-8)l=x-r.width-16;if(t+r.height>innerHeight-8)t=Math.max(8,innerHeight-r.height-8);
  tip.style.left=Math.max(8,l)+'px';tip.style.top=t+'px'}
function open(el,x,y){if(!IT[el.dataset.id])return;const t=T(el.dataset.id);tip.innerHTML=(el.dataset.note?`<div class="tnote"><b>${L('tip.author_note')}</b>${esc(el.dataset.note)}</div>`:'')+tipHtml(t);tip.style.display='block';
  if(x==null){const r=el.getBoundingClientRect();x=r.right;y=r.top}place(x,y)}
function hide(){clearTimeout(tmr);tip.style.display='none'}
function heroTip(el){const h=HN(el.dataset.hero);const CL=CLS;
  return `<div class="tab"><div class="tab__h" style="justify-content:flex-start;gap:10px">${h.img?`<img src="${esc(h.img)}" alt="" style="width:40px;height:40px;border-radius:50%;background:${esc(h.color||'var(--color-shade)')}">`:''}
  <span><span class="tn">${esc(h.n)}</span>${h.type?`<br><small style="color:var(--color-muted)">${CL[h.type]||esc(h.type)}</small>`:''}</span></div>
  ${el.dataset.mu?`<div class="d" style="margin-bottom:0">${esc(el.dataset.mu)}</div>`:el.dataset.games?`<div class="d" style="margin-bottom:0">${L('tip.games_vs',{n:esc(el.dataset.games)})}</div>`:''}</div>`}
function bindHero(root){root.querySelectorAll('[data-hero]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=heroTip(el);tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),120)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindPos(root){bindHero(root);root.querySelectorAll('[data-pos]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=posTip(+el.dataset.pos);tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),150)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindTips(root){bindPos(root);root.querySelectorAll('[data-id]').forEach(el=>{
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>open(el,e.clientX,e.clientY),250)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>open(el));
  el.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){tip.style.display==='block'?hide():open(el)}});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
addEventListener('scroll',hide,{passive:true});

let start=location.hash.slice(1);
if(!views.includes(start)){try{start=localStorage.getItem('dl-view:'+D.hero.name)||''}catch(e){start=''}}
/* language switch: keep the current view when moving to the other language's page */
document.querySelectorAll('.lang a').forEach(a=>a.addEventListener('click',()=>{a.href=a.getAttribute('href').split('#')[0]+location.hash}));
if(D.contentFallback){const n=document.createElement('p');n.className='rail__note';n.textContent=L('content.fallback');$('introBox').before(n)}
renderFresh();renderRail();bindTips($('intro'));
show(start||views[0],false);
/* live check: did a patch come out after this page was generated? (API allows CORS) */
fetch('https://api.deadlock-api.com/v2/patches').then(r=>{if(!r.ok)throw 0;return r.json()}).then(list=>{LIVE='ok';
  const known=new Set(P.map(p=>Math.floor(p.t/DAY)));let added=0;
  for(const x of list){if(!/update|\d{2}-\d{2}-\d{4}|gameplay|patch/i.test(x.title||''))continue;
    const t=Date.parse(x.pub_date)/1000,d=Math.floor(t/DAY);if(known.has(d)||known.has(d-1)||known.has(d+1))continue;
    known.add(d);P.push({t,title:x.title.trim(),big:false});added++}
  renderFresh();if(added){const v=document.querySelector('.pick[aria-current=true]')?.dataset.v;renderRail();show(v||views[0],false)}
}).catch(()=>{LIVE='fail';renderFresh()});
</script>
